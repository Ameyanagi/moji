context:
  version: "0.1.0"

package:
  name: mojo-moji
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mojo precompile src/moji -o ${{ PREFIX }}/lib/mojo/moji.mojoc

requirements:
  build:
    - mojo-compiler =1.0.0
  host:
    - mojo-compiler =1.0.0
  run:
    - mojo-compiler =1.0.0

tests:
  - script:
      - mojo run test_package.mojo
    files:
      recipe:
        - test_package.mojo

about:
  homepage: https://github.com/Ameyanagi/moji
  repository: https://github.com/Ameyanagi/moji
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: Unicode text, search, and layout primitives for Mojo.

extra:
  maintainers:
    - Ameyanagi
